    <!-- IndexedDB & Script Logic -->
    <script>
        const DB_NAME = 'TRB_DB';
        const DB_VERSION = 1;
        let db;
        
        let state = {
            items: [],
            shiftDate: new Date().toISOString().split('T')[0],
            currentShift: '15:00-23:00',
            generalNote: ''
        };
        
        let activeRange = null;
        let draggedItemId = null;
        let autoScrollInterval = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings');
                    if(!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(); };
                req.onerror = (e) => reject(e);
            });
        }

        function dbGet(store, key) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readonly');
                const req = key ? tx.objectStore(store).get(key) : tx.objectStore(store).getAll();
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = () => resolve(key ? null : []);
            });
        }

        function dbPut(store, value, key) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                key ? tx.objectStore(store).put(value, key) : tx.objectStore(store).put(value);
                tx.oncomplete = () => resolve();
            });
        }

        function dbDelete(store, key) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).delete(key);
                tx.oncomplete = () => resolve();
            });
        }

        function dbClear(store) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).clear();
                tx.oncomplete = () => resolve();
            });
        }

        async function loadState() {
            const savedDate = await dbGet('settings', 'shiftDate');
            const savedShift = await dbGet('settings', 'currentShift');
            const savedNote = await dbGet('settings', 'generalNote');
            
            if(savedDate) state.shiftDate = savedDate;
            if(savedShift) state.currentShift = savedShift;
            if(savedNote) state.generalNote = savedNote;
            
            document.getElementById('shiftDate').value = state.shiftDate;
            document.getElementById('shiftSelect').value = state.currentShift;
            document.getElementById('generalNote').value = state.generalNote;

            const savedItems = await dbGet('items');
            state.items = savedItems || [];
            
            applyTheme();
            render();
        }

        async function updateSettings(key, value) {
            state[key] = value;
            await dbPut('settings', value, key);
            if(key === 'shift') render(); 
        }

        /* --- Dosya İsimlendirme Formatı: TRB Follow Up (23-9-2026) - 15-23 --- */
        function getExportFileName(extension) {
            if (!state.shiftDate) return `TRB Follow Up.${extension}`;
            
            const parts = state.shiftDate.split('-'); // YYYY-MM-DD
            const year = parts[0];
            const month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);
            const formattedDate = `${day}-${month}-${year}`;
            
            const formattedShift = (state.currentShift || '').replace(/:00/g, '');
            
            return `TRB Follow Up (${formattedDate}) - ${formattedShift}.${extension}`;
        }

        /* --- Renkli Excel Durum Rozeti Görseli Oluşturucu (Canvas) --- */
        function generateStatusBadgeBase64(status) {
            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 40;
            const ctx = canvas.getContext('2d');

            let mainColor = '#3b82f6';
            let lightColor = '#93c5fd';
            let darkColor = '#1d4ed8';
            let text = 'BİLGİ';

            if (status === 'critical') {
                mainColor = '#ef4444'; lightColor = '#fca5a5'; darkColor = '#b91c1c'; text = 'KRİTİK';
            } else if (status === 'action') {
                mainColor = '#a855f7'; lightColor = '#d8b4fe'; darkColor = '#6b21a8'; text = 'AKSİYON';
            } else if (status === 'warning') {
                mainColor = '#f59e0b'; lightColor = '#fde68a'; darkColor = '#b45309'; text = 'UYARI';
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = 22, cy = 20, r = 11;
            const grad = ctx.createRadialGradient(cx - 3, cy - 4, 1, cx, cy, r);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.3, lightColor);
            grad.addColorStop(0.7, mainColor);
            grad.addColorStop(1, darkColor);

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 16px Calibri, Arial, sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 44, 21);

            return canvas.toDataURL('image/png');
        }

        /* Shift & Time Helpers */
        function getShiftStartHour() { return parseInt(state.currentShift.split('-')[0].split(':')[0], 10); }
        function getShiftEndHour() { return parseInt(state.currentShift.split('-')[1].split(':')[0], 10); }

        function timeToMinutes(timeStr) {
            let [h, m] = timeStr.split(':').map(Number);
            const startHour = getShiftStartHour();
            const endHour = getShiftEndHour();
            const crossesMidnight = endHour <= startHour;
            
            if (crossesMidnight && h < startHour) h += 24;
            return (h * 60) + m;
        }

        function generateShiftIntervals() {
            const intervals = [];
            let start = getShiftStartHour();
            let end = getShiftEndHour();
            let current = start;
            let limit = (end <= start) ? end + 24 : end;

            while(current < limit) {
                let actualH = current % 24;
                let nextH = (current + 1) % 24;
                const pad = (num) => num.toString().padStart(2, '0');
                intervals.push(`${pad(actualH)}:00 - ${pad(nextH)}:00`);
                current++;
            }
            return intervals;
        }

        function calculateRange(timeStr) {
            let [h, m] = timeStr.split(':').map(Number);
            let nextH = (h + 1) % 24;
            let pad = (n) => n.toString().padStart(2, '0');
            return `${pad(h)}:00 - ${pad(nextH)}:00`;
        }

        async function clearAll() {
            if(confirm("Tüm vardiya verilerini kalıcı olarak silmek istediğinize emin misiniz?")) {
                state.items = [];
                state.generalNote = '';
                document.getElementById('generalNote').value = '';
                activeRange = null;
                await dbClear('items');
                await dbPut('settings', '', 'generalNote');
                render();
            }
        }

        /* SAAT GÜNCELLEME SÜRECİ */
        function updateItemTime(id, value) {
            const idx = state.items.findIndex(i => i.id === id);
            if(idx > -1) {
                state.items[idx].time = value;
                state.items[idx].range = calculateRange(value);
                dbPut('items', state.items[idx]);
            }
        }

        async function finishTimeEdit() {
            state.items.sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
            for (let item of state.items) {
                await dbPut('items', item);
            }
            render();
        }

        async function updateItemData(id, field, value) {
            const idx = state.items.findIndex(i => i.id === id);
            if(idx > -1) {
                state.items[idx][field] = value;
                await dbPut('items', state.items[idx]);
                render();
            }
        }

        async function deleteItem(id) {
            if(confirm("Bu kartı silmek istiyor musunuz?")) {
                state.items = state.items.filter(i => i.id !== id);
                await dbDelete('items', id);
                render();
            }
        }

        async function insertSnippet(id, text) {
            const idx = state.items.findIndex(i => i.id === id);
            const currentNote = state.items[idx].note || "";
            const newNote = currentNote ? currentNote + "\n" + text : text;
            state.items[idx].note = newNote;
            await dbPut('items', state.items[idx]);
            document.getElementById(`note-${id}`).value = newNote;
        }

        /* --- Sürükle, Bırak ve Otomatik Kaydırma (Auto-Scroll) --- */
        function handleDragStart(e, id) {
            draggedItemId = id;
            e.dataTransfer.effectAllowed = 'move';
            e.target.classList.add('dragging');
        }

        function handleContainerDragOver(e) {
            e.preventDefault();
            const grid = document.getElementById('itemsGrid');
            if (!grid) return;

            const rect = grid.getBoundingClientRect();
            const edgeThreshold = 80;
            const scrollSpeed = 16;

            if (e.clientY < rect.top + edgeThreshold) {
                startAutoScroll(grid, -scrollSpeed);
            } else if (e.clientY > rect.bottom - edgeThreshold) {
                startAutoScroll(grid, scrollSpeed);
            } else {
                stopAutoScroll();
            }
        }

        function startAutoScroll(container, speed) {
            if (!autoScrollInterval) {
                autoScrollInterval = setInterval(() => {
                    container.scrollTop += speed;
                }, 16);
            }
        }

        function stopAutoScroll() {
            if (autoScrollInterval) {
                clearInterval(autoScrollInterval);
                autoScrollInterval = null;
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const card = e.currentTarget;
            card.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        async function handleDrop(e, targetId) {
            e.preventDefault();
            stopAutoScroll();
            e.currentTarget.classList.remove('drag-over');
            if (!draggedItemId || draggedItemId === targetId) return;

            const fromIdx = state.items.findIndex(i => i.id === draggedItemId);
            const toIdx = state.items.findIndex(i => i.id === targetId);

            if (fromIdx > -1 && toIdx > -1) {
                const [movedItem] = state.items.splice(fromIdx, 1);
                state.items.splice(toIdx, 0, movedItem);

                for (let item of state.items) {
                    await dbPut('items', item);
                }
                render();
            }
        }

        function handleDragEnd(e) {
            stopAutoScroll();
            e.target.classList.remove('dragging');
            draggedItemId = null;
        }

        function addExtraImages(id, inputElem) {
            const files = inputElem.files;
            if(!files.length) return;
            const idx = state.items.findIndex(i => i.id === id);
            
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const resized = await resizeImage(e.target.result);
                    state.items[idx].images.push(resized);
                    await dbPut('items', state.items[idx]);
                    render();
                };
                reader.readAsDataURL(file);
            });
        }

        async function removeExtraImage(id, imgIndex) {
            if(confirm("Bu görseli silmek istediğinize emin misiniz?")) {
                const idx = state.items.findIndex(i => i.id === id);
                state.items[idx].images.splice(imgIndex, 1);
                await dbPut('items', state.items[idx]);
                render();
            }
        }

        /* Canvas & Clipboard */
        let canvas, ctx, originalImgData;
        let isDrawing = false;

        window.addEventListener('paste', (e) => {
            if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file') {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        const resizedBase64 = await resizeImage(event.target.result);
                        initCanvas(resizedBase64);
                        
                        const now = new Date();
                        document.getElementById('modalTime').value = now.toTimeString().substring(0,5);
                        document.getElementById('modalStatus').value = 'info';
                        document.getElementById('pasteModal').classList.remove('hidden');
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        function initCanvas(base64Str) {
            canvas = document.getElementById('drawCanvas');
            ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                originalImgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                const container = document.getElementById('canvasContainer');
                const scale = Math.min(1, container.clientWidth / img.width, container.clientHeight / img.height);
                canvas.style.transform = `scale(${scale})`;
                canvas.style.transformOrigin = 'top center';
            };
            img.src = base64Str;
            setupCanvasDrawing();
        }

        function setupCanvasDrawing() {
            canvas.onmousedown = (e) => startDraw(e);
            canvas.onmousemove = (e) => draw(e);
            window.onmouseup = () => stopDraw();
            
            canvas.ontouchstart = (e) => { e.preventDefault(); startDraw(e.touches[0]); };
            canvas.ontouchmove = (e) => { e.preventDefault(); draw(e.touches[0]); };
            window.ontouchend = () => stopDraw();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }

        function startDraw(e) {
            isDrawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDraw() { if (isDrawing) { ctx.closePath(); isDrawing = false; } }
        function clearCanvas() { if(ctx && originalImgData) ctx.putImageData(originalImgData, 0, 0); }
        function closeModal() { document.getElementById('pasteModal').classList.add('hidden'); }

        async function savePastedItem() {
            const timeVal = document.getElementById('modalTime').value;
            const statusVal = document.getElementById('modalStatus').value;
            if(!timeVal) { alert("Lütfen saati girin."); return; }
            
            const finalImage = canvas.toDataURL('image/png', 1.0);
            const range = calculateRange(timeVal);
            
            const newItem = {
                id: Date.now(),
                time: timeVal,
                range: range,
                images: [finalImage],
                note: '',
                status: statusVal
            };
            
            state.items.push(newItem);
            state.items.sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
            
            for (let item of state.items) {
                await dbPut('items', item);
            }

            closeModal();
            activeRange = range;
            render();
        }

        function setActive(range) {
            activeRange = range;
            render();
        }

        /* --- Dashboard & Oransal Timeline Bar --- */
        function renderDashboardTimeline() {
            const statsDiv = document.getElementById('dashboardStats');
            const barDiv = document.getElementById('timelineBar');
            const labelsDiv = document.getElementById('timelineLabels');
            
            let crit = 0, warn = 0, act = 0, info = 0;
            state.items.forEach(i => {
                if(i.status === 'critical') crit++;
                else if(i.status === 'action') act++;
                else if(i.status === 'warning') warn++;
                else info++;
            });
            
            statsDiv.innerHTML = `
                <span class="bg-gray-100 dark:bg-gray-700 px-2.5 py-1 rounded-lg text-gray-800 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Total: <b>${state.items.length}</b></span>
                <span class="bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 px-2.5 py-1 rounded-lg border border-blue-200 dark:border-blue-800">Bilgi: <b>${info}</b></span>
                <span class="bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300 px-2.5 py-1 rounded-lg border border-amber-200 dark:border-amber-800">Uyarı: <b>${warn}</b></span>
                <span class="bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300 px-2.5 py-1 rounded-lg border border-purple-200 dark:border-purple-800">Aksiyon: <b>${act}</b></span>
                <span class="bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300 px-2.5 py-1 rounded-lg border border-red-200 dark:border-red-800">Kritik: <b>${crit}</b></span>
            `;

            const intervals = generateShiftIntervals();
            barDiv.innerHTML = '';
            labelsDiv.innerHTML = '';
            
            intervals.forEach(inv => {
                const startHourStr = inv.split('-')[0];
                const itemsInInv = state.items.filter(i => i.range === inv);
                
                const seg = document.createElement('div');
                seg.className = `flex-1 h-full border-r border-white dark:border-gray-800 last:border-0 hover:opacity-90 cursor-pointer transition flex overflow-hidden bg-gray-200 dark:bg-gray-700`;
                seg.title = `${inv} - Toplam: ${itemsInInv.length} Kayıt`;
                seg.onclick = () => setActive(inv);

                if (itemsInInv.length === 0) {
                    seg.innerHTML = `<div class="w-full h-full bg-gray-200 dark:bg-gray-700"></div>`;
                } else {
                    let segInfo = itemsInInv.filter(i => i.status === 'info').length;
                    let segWarn = itemsInInv.filter(i => i.status === 'warning').length;
                    let segAct = itemsInInv.filter(i => i.status === 'action').length;
                    let segCrit = itemsInInv.filter(i => i.status === 'critical').length;
                    let totalInInv = itemsInInv.length;

                    let pctInfo = (segInfo / totalInInv) * 100;
                    let pctWarn = (segWarn / totalInInv) * 100;
                    let pctAct = (segAct / totalInInv) * 100;
                    let pctCrit = (segCrit / totalInInv) * 100;

                    let innerHtml = '';
                    if (pctInfo > 0) innerHtml += `<div style="width: ${pctInfo}%" class="h-full bg-blue-500" title="Bilgi: ${segInfo}"></div>`;
                    if (pctWarn > 0) innerHtml += `<div style="width: ${pctWarn}%" class="h-full bg-amber-500" title="Uyarı: ${segWarn}"></div>`;
                    if (pctAct > 0) innerHtml += `<div style="width: ${pctAct}%" class="h-full bg-purple-600" title="Aksiyon: ${segAct}"></div>`;
                    if (pctCrit > 0) innerHtml += `<div style="width: ${pctCrit}%" class="h-full bg-red-500" title="Kritik: ${segCrit}"></div>`;

                    seg.innerHTML = innerHtml;
                }
                
                barDiv.appendChild(seg);

                const lbl = document.createElement('div');
                lbl.className = 'flex-1 text-center';
                lbl.textContent = startHourStr;
                labelsDiv.appendChild(lbl);
            });
        }

        /* --- Excel Export --- */
        async function exportToExcel() {
            if (state.items.length === 0 && !state.generalNote) {
                alert("Dışa aktarılacak veri bulunamadı.");
                return;
            }

            const workbook = new ExcelJS.Workbook();
            workbook.creator = 'Vardiya Raporu Aracı';

            const summarySheet = workbook.addWorksheet('GENEL ÖZET');
            summarySheet.columns = [{ width: 100 }];
            
            const titleRow = summarySheet.getRow(1);
            titleRow.getCell(1).value = `VARDİYA GENEL ÖZETİ (${state.shiftDate} | ${state.currentShift})`;
            titleRow.font = { name: 'Calibri', bold: true, size: 14, color: { argb: 'FFFFFFFF' } };
            titleRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C2833' } };
            titleRow.alignment = { vertical: 'middle', horizontal: 'center' };
            titleRow.height = 30;

            const noteRow = summarySheet.getRow(3);
            noteRow.getCell(1).value = state.generalNote || "Genel not girilmedi.";
            noteRow.font = { name: 'Calibri', size: 12 };
            noteRow.alignment = { vertical: 'top', horizontal: 'left', wrapText: true };
            noteRow.height = 150;

            const grouped = {};
            state.items.forEach(item => {
                if(!grouped[item.range]) grouped[item.range] = [];
                grouped[item.range].push(item);
            });

            const allRanges = Object.keys(grouped).sort((a,b) => timeToMinutes(a.substring(0,5)) - timeToMinutes(b.substring(0,5)));

            for (const range of allRanges) {
                const rangeItems = grouped[range];

                const safeSheetName = range.replace(/:/g, '.').replace(/[/\\?*\[\]]/g, '-');
                const worksheet = workbook.addWorksheet(safeSheetName);

                worksheet.columns = [{ width: 18 }, { width: 115 }];
                let currentRow = 1;

                for (let i = 0; i < rangeItems.length; i++) {
                    const item = rangeItems[i];
                    if (i > 0) currentRow += 2;
                    const cardStartRow = currentRow;

                    // Row 1: İşlem Saati
                    const r1 = worksheet.getRow(currentRow++);
                    r1.height = 25;
                    r1.getCell(1).value = "İŞLEM SAATİ";
                    r1.getCell(2).value = item.time;
                    formatCell(r1.getCell(1), true, 'FF1C2833', 'center');
                    formatCell(r1.getCell(2), true, 'FF000000', 'left', false);

                    // Row 2: Durum
                    const r2 = worksheet.getRow(currentRow++);
                    r2.height = 32;
                    r2.getCell(1).value = "DURUM";
                    r2.getCell(2).value = "";
                    formatCell(r2.getCell(1), true, 'FF1C2833', 'center');
                    formatCell(r2.getCell(2), false, 'FFFFFFFF', 'left', false);

                    const badgeBase64 = generateStatusBadgeBase64(item.status);
                    const badgeImgId = workbook.addImage({ base64: badgeBase64, extension: 'png' });
                    worksheet.addImage(badgeImgId, {
                        tl: { col: 1, row: currentRow - 2, nativeCellOffset: { x: 10 * 9525, y: 3 * 9525 } },
                        ext: { width: 135, height: 30 },
                        editAs: 'oneCell'
                    });

                    // İşlem Ekran Görüntüleri - Orijinal yüksek kalite korunuyor
                    for (let imgIndex = 0; imgIndex < item.images.length; imgIndex++) {
                        const imgData = item.images[imgIndex];
                        const dimensions = await getImageDimensions(imgData);
                        
                        // Görsel orijinal yüksek çözünürlüğünde eklenir
                        const targetWidthPx = Math.min(800, dimensions.width);
                        const aspect = dimensions.height / dimensions.width;
                        const targetHeightPx = targetWidthPx * aspect;
                        const imgRowHeightPt = targetHeightPx * 0.95;

                        const rImg = worksheet.getRow(currentRow++);
                        rImg.height = imgRowHeightPt;
                        rImg.getCell(1).value = `GÖRSEL ${imgIndex + 1}`;
                        formatCell(rImg.getCell(1), true, 'FF1C2833', 'center');

                        const extType = imgData.startsWith('data:image/png') ? 'png' : 'jpeg';
                        const imageId = workbook.addImage({ base64: imgData, extension: extType });
                        worksheet.addImage(imageId, {
                            tl: { col: 1, row: currentRow - 2, nativeCellOffset: { x: 5 * 9525, y: 5 * 9525 } },
                            ext: { width: targetWidthPx, height: targetHeightPx },
                            editAs: 'oneCell'
                        });
                    }

                    // Notlar
                    const rNote = worksheet.getRow(currentRow++);
                    rNote.height = 65;
                    rNote.getCell(1).value = "NOTLAR";
                    rNote.getCell(2).value = item.note || '';
                    formatCell(rNote.getCell(1), true, 'FF1C2833', 'center');
                    formatCell(rNote.getCell(2), false, 'FF000000', 'left', true);

                    // Çerçeveler
                    for (let r = cardStartRow; r < currentRow; r++) {
                        for (let c = 1; c <= 2; c++) {
                            let cellBorder = {
                                top: { style: 'thin', color: { argb: 'FFCBD5E1' } },
                                left: { style: 'thin', color: { argb: 'FFCBD5E1' } },
                                bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } },
                                right: { style: 'thin', color: { argb: 'FFCBD5E1' } }
                            };
                            if (r === cardStartRow) cellBorder.top = { style: 'thick', color: { argb: 'FF000000' } };
                            if (r === currentRow - 1) cellBorder.bottom = { style: 'thick', color: { argb: 'FF000000' } };
                            if (c === 1) cellBorder.left = { style: 'thick', color: { argb: 'FF000000' } };
                            if (c === 2) cellBorder.right = { style: 'thick', color: { argb: 'FF000000' } };
                            worksheet.getRow(r).getCell(c).border = cellBorder;
                        }
                    }
                }
            }

            const buffer = await workbook.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), getExportFileName('xlsx'));
        }

        function formatCell(cell, isBold, bgColorHex, alignH, wrap = false) {
            cell.font = { name: 'Calibri', bold: isBold, size: 11, color: { argb: bgColorHex === 'FF1C2833' ? 'FFFFFFFF' : 'FF000000' } };
            if (bgColorHex !== 'FF000000') {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgColorHex } };
            }
            cell.alignment = { vertical: bgColorHex === 'FF1C2833' ? 'middle' : 'center', horizontal: alignH, wrapText: wrap, indent: 1 };
        }

        function resizeImage(base64Str, maxWidth = 2560) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height;
                    if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
                    const cvs = document.createElement('canvas');
                    cvs.width = w; cvs.height = h;
                    const ctx = cvs.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(cvs.toDataURL('image/png', 1.0));
                };
                img.src = base64Str;
            });
        }

        function getImageDimensions(base64Str) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve({ width: img.width, height: img.height });
                img.src = base64Str;
            });
        }

        function applyTheme() {
            const isDark = localStorage.getItem('trb_theme') === 'dark';
            if (isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('trb_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        }

        window.onload = async () => {
            await initDB();
            await loadState();
        };
        
        /* --- Resim Görüntüleme (Lightbox) Fonksiyonları --- */
        function openLightbox(imgSrc) {
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('imageLightbox').classList.remove('hidden');
        }
        
        function closeLightbox(e) {
            document.getElementById('imageLightbox').classList.add('hidden');
            document.getElementById('lightboxImg').src = '';
        }
        
        /* --- JSON Export (Dışa Aktar) --- */
        function exportToJson() {
            if (state.items.length === 0 && !state.generalNote) {
                alert("Dışa aktarılacak veri bulunamadı.");
                return;
            }
            
            // Tüm state objesini (saat, notlar, resimler dahil) JSON formatına çeviriyoruz
            const dataStr = JSON.stringify(state, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            
            // Mevcut isimlendirme formatınızı kullanarak JSON indiriyoruz
            const fileName = getExportFileName('json'); 
            saveAs(blob, fileName);
        }
        
        /* --- JSON Import (İçe Aktar) --- */
        async function importFromJson(event) {
            const file = event.target.files[0];
            if (!file) return;
        
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const importedState = JSON.parse(e.target.result);
                    
                    // Temel JSON doğrulama
                    if (importedState && Array.isArray(importedState.items)) {
                        if (confirm("Mevcut ekrandaki veriler silinecek ve yüklediğiniz dosyadaki veriler aktarılacak. Emin misiniz?")) {
                            // Global state'i güncelliyoruz
                            state = importedState;
                            
                            // IndexedDB'yi temizleyip yeni verileri yazıyoruz
                            await dbClear('items');
                            for (let item of state.items) {
                                await dbPut('items', item);
                            }
                            
                            await dbPut('settings', state.shiftDate, 'shiftDate');
                            await dbPut('settings', state.currentShift, 'currentShift');
                            await dbPut('settings', state.generalNote, 'generalNote');
                            
                            // Arayüzdeki inputları yeni state'e göre dolduruyoruz
                            document.getElementById('shiftDate').value = state.shiftDate || '';
                            document.getElementById('shiftSelect').value = state.currentShift || '';
                            document.getElementById('generalNote').value = state.generalNote || '';
                            
                            render();
                            alert("Veriler başarıyla içe aktarıldı!");
                        }
                    } else {
                        alert("Geçersiz veya bozuk JSON formatı.");
                    }
                } catch (err) {
                    alert("Dosya okunurken bir hata oluştu: " + err.message);
                }
                event.target.value = ''; // Aynı dosyanın tekrar seçilebilmesi için inputu sıfırlıyoruz
            };
            reader.readAsText(file);
        }
    </script>
    
    <!-- Tam Ekran Resim (Lightbox) Modalı -->
    <div id="imageLightbox" class="fixed inset-0 bg-black/90 hidden z-[60] flex items-center justify-center p-4 transition-opacity cursor-zoom-out" onclick="closeLightbox(event)">
        <img id="lightboxImg" src="" class="max-w-full max-h-full object-contain rounded shadow-2xl cursor-default" onclick="event.stopPropagation()">
        <button class="absolute top-4 right-4 text-white hover:text-gray-300 text-3xl" onclick="closeLightbox(event)">
            <i class="fas fa-times"></i>
        </button>
    </div>
</body>
</html>
